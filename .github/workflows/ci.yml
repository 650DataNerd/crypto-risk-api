name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cryptouser
          POSTGRES_PASSWORD: cryptopass
          POSTGRES_DB: cryptorisk_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Security audit
        run: |
          uv run pip-audit \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-1845
        # PYSEC-2026-1325: ecdsa - no fix available upstream
        # PYSEC-2026-1845: pytest - fix requires pytest>=9.0.3 which is
        #   incompatible with pytest-asyncio==0.23.8; revisit when
        #   pytest-asyncio releases pytest 9 support


      - name: Run tests
        env:
          APP_NAME: crypto-risk-api
          APP_VERSION: 0.1.0
          DATABASE_URL: postgresql+asyncpg://cryptouser:cryptopass@localhost:5432/cryptorisk
          TEST_DATABASE_URL: postgresql+asyncpg://cryptouser:cryptopass@localhost:5432/cryptorisk_test
          SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          TESTING: true
          REDIS_URL: redis://localhost:6379
        run: uv run pytest tests/ -v --cov=app --cov-report=term-missing
