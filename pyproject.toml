[project]
name = "cryptorisk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.138.2",
    "httpx>=0.28.1",
    "passlib[argon2]>=1.7.4",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "redis>=8.0.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.5.0",
    "pip-audit>=2.10.1",
    "pytest>=8.2,<9",
    "pytest-asyncio==0.23.8",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI Depends() in function defaults - this is correct FastAPI usage
    "BLE001",  # Blind exception catch - intentional for Redis graceful fallback
    "S110",    # try-except-pass - intentional for Redis graceful fallback
    "DTZ003",  # datetime.utcnow() - matches Postgres TIMESTAMP WITHOUT TIMEZONE column
]


[tool.coverage.run]
source = ["app"]
omit = [
    "app/worker.py",
    "app/services/price_service.py",
]

[tool.coverage.report]
fail_under = 75
